# Paths are relative to the repository root. No weights are bundled.
paths:
  raw_cctv: data/raw/cctv
  raw_external: data/raw/external
  interim: data/interim
  processed: data/processed
  model_weights: models/yolov8n.pt

# Step 5 only: raw detection outputs; cleaning/integration are future steps.
detection:
  manifest: data/interim/image_manifest.parquet
  output_dir: data/interim/detection_pipeline
  batch_size: 100
  image_limit: null
